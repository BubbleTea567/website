<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香草猫娘 · Vanilla Neko</title>
  <!-- GSAP 动画库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fdf8f2 0%, #f7efe6 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #3e2e24;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 柔光装饰 */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { width: 400px; height: 400px; background: #ffd9b5; top: -120px; left: -120px; }
    .glow-2 { width: 500px; height: 500px; background: #ffe7d4; bottom: -180px; right: -100px; }
    .glow-3 { width: 300px; height: 300px; background: #fce2d0; top: 40%; left: 60%; opacity: 0.3; }

    /* 主卡片 */
    .card {
      position: relative;
      z-index: 10;
      width: 90vw;
      max-width: 720px;
      background: rgba(255, 251, 245, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 64px;
      padding: 4rem 3rem;
      box-shadow: 0 30px 60px -20px rgba(140, 100, 70, 0.25),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    /* 猫耳 */
    .cat-ears {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 68px;
      z-index: 5;
      pointer-events: none;
    }
    .ear {
      width: 0; height: 0;
      border-left: 32px solid transparent;
      border-right: 32px solid transparent;
      border-bottom: 48px solid #f7e3d3;
      filter: drop-shadow(0 6px 8px rgba(180, 130, 100, 0.12));
      transform: rotate(-10deg);
      position: relative;
    }
    .ear::after {
      content: '';
      position: absolute;
      top: 16px; left: -16px;
      width: 32px; height: 32px;
      background: #ffdcc4;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.6;
    }
    .ear.right { transform: rotate(10deg) scaleX(-1); }

    /* 标题 */
    .title {
      font-size: clamp(3.2rem, 12vw, 5rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #4b372b;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .title-accent {
      background: linear-gradient(135deg, #c99b7b, #b07d5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }
    .title-paw { font-size: 2.8rem; display: inline-block; }

    /* 副标题 */
    .subtitle {
      font-size: 1.15rem;
      color: #7e6453;
      margin-top: 0.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .subtitle-line { width: 48px; height: 1.5px; background: #dcc9ba; border-radius: 4px; }

    /* 猫娘状态面板 */
    .status-panel {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .status-item {
      background: rgba(255, 245, 235, 0.8);
      border-radius: 40px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #604e40;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 14px -10px rgba(150, 110, 80, 0.15);
    }
    .status-value { font-weight: 700; color: #b07d5e; }

    /* 回复气泡 */
    .reply-bubble {
      min-height: 62px;
      background: rgba(255, 250, 244, 0.9);
      border-radius: 32px;
      padding: 1rem 1.8rem;
      margin-bottom: 2rem;
      font-size: 1.05rem;
      color: #5d4637;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 20px -14px rgba(150, 110, 80, 0.2);
      transition: all 0.2s ease;
    }
    .reply-emoji { font-size: 1.4rem; }

    /* 按钮组 */
    .button-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .cta-button {
      background: #4b372b;
      color: #fef7f0;
      border: 1px solid #6a5444;
      border-radius: 40px;
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: 550;
      cursor: pointer;
      box-shadow: 0 18px 28px -14px #4b372b80;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .cta-button:hover {
      background: #5f4639;
      transform: scale(1.02);
    }
    .cta-button:active { transform: scale(0.97); }
    .cta-button.secondary {
      background: rgba(255, 245, 235, 0.9);
      color: #4b372b;
      border: 1px solid #dcc9ba;
      box-shadow: 0 12px 20px -14px rgba(150, 110, 80, 0.2);
    }
    .cta-button.secondary:hover { background: #fff9f2; }
    .cta-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 浮动爪印 */
    .floating-paw {
      position: absolute;
      font-size: 2rem;
      opacity: 0.25;
      z-index: 1;
      user-select: none;
      pointer-events: none;
      color: #c9a78b;
    }
    .paw-1 { top: 12%; left: 8%; transform: rotate(-20deg); }
    .paw-2 { bottom: 15%; right: 10%; transform: rotate(25deg); font-size: 3rem; }
    .paw-3 { top: 25%; right: 15%; transform: rotate(45deg); font-size: 1.8rem; }

    /* 连接状态指示器 */
    .conn-status {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 251, 245, 0.85);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #7e6453;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 16px -10px rgba(150, 110, 80, 0.2);
    }
    .conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ccc;
      transition: background 0.3s ease;
    }
    .conn-dot.online { background: #7ec87e; }
    .conn-dot.offline { background: #e08a7a; }

    @media (max-width: 560px) {
      .card { padding: 3rem 1.5rem; border-radius: 40px; }
      .cat-ears { top: -22px; gap: 40px; }
      .ear { border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 34px solid #f7e3d3; }
      .ear::after { width: 22px; height: 22px; top: 12px; left: -11px; }
      .title-paw { font-size: 2.2rem; }
      .reply-bubble { font-size: 0.95rem; padding: 0.8rem 1.2rem; }
      .cta-button { padding: 0.8rem 1.5rem; font-size: 0.9rem; }
      .status-item { font-size: 0.8rem; padding: 0.5rem 1rem; }
    }
  </style>
</head>
<body>
  <!-- 连接状态指示器 -->
  <div class="conn-status">
    <span class="conn-dot" id="connDot"></span>
    <span id="connText">连接中…</span>
  </div>

  <!-- 背景装饰 -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="floating-paw paw-1">🐾</div>
  <div class="floating-paw paw-2">🐾</div>
  <div class="floating-paw paw-3">🐾</div>

  <!-- 主卡片 -->
  <main class="card">
    <div class="cat-ears">
      <div class="ear"></div>
      <div class="ear right"></div>
    </div>

    <h1 class="title">
      <span class="title-accent">香草</span>
      <span>猫娘</span>
      <span class="title-paw">🐱</span>
    </h1>

    <div class="subtitle">
      <span class="subtitle-line"></span>
      <span>Vanilla Neko · 温柔治愈</span>
      <span class="subtitle-line"></span>
    </div>

    <!-- 猫娘状态 -->
    <div class="status-panel">
      <div class="status-item">🌿 饱食度 <span class="status-value" id="fullnessVal">--</span></div>
      <div class="status-item">💗 心情 <span class="status-value" id="moodVal">--</span></div>
      <div class="status-item">💞 亲密度 <span class="status-value" id="affectionVal">--</span></div>
    </div>

    <!-- 猫娘回复气泡 -->
    <div class="reply-bubble" id="replyBubble">
      <span class="reply-emoji">😺</span>
      <span id="replyText">正在唤醒香草猫娘…</span>
    </div>

    <!-- 按钮组 -->
    <div class="button-group">
      <button class="cta-button" id="patBtn">
        <span>摸摸猫娘</span>
        <span>🐾</span>
      </button>
      <button class="cta-button secondary" id="feedBtn">
        <span>投喂小鱼干</span>
        <span>🐟</span>
      </button>
    </div>
  </main>

  <script>
    // ============================================
    // 配置：后端 API 地址（按实际部署修改）
    // ============================================
    const API_BASE = 'http://127.0.0.1:5000';

    // ============================================
    // 连接状态管理
    // ============================================
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    function setConnectionStatus(online, text) {
      connDot.className = 'conn-dot ' + (online ? 'online' : 'offline');
      connText.textContent = text;
    }

    // ============================================
    // 前端状态
    // ============================================
    const state = {
      fullness: 0,
      mood: 0,
      affection: 0,
      isRequesting: false
    };

    // ============================================
    // 更新 UI
    // ============================================
    function updateStatusUI(nekoState) {
      if (!nekoState) return;
      state.fullness = nekoState.fullness;
      state.mood = nekoState.mood_level;
      state.affection = nekoState.affection;

      animateNumber('fullnessVal', state.fullness);
      animateNumber('moodVal', state.mood);
      animateNumber('affectionVal', state.affection);
    }

    function animateNumber(elId, target) {
      const el = document.getElementById(elId);
      const current = parseInt(el.textContent) || 0;
      const obj = { val: current };
      gsap.to(obj, {
        val: target,
        duration: 0.6,
        ease: 'power2.out',
        onUpdate: () => { el.textContent = Math.round(obj.val); }
      });
    }

    function showReply(reply) {
      const textEl = document.getElementById('replyText');
      const emojiEl = document.querySelector('#replyBubble .reply-emoji');

      gsap.to('#replyBubble', {
        duration: 0.2,
        opacity: 0.3,
        y: -6,
        onComplete: () => {
          textEl.textContent = reply.text;
          emojiEl.textContent = reply.emoji || '😺';
          gsap.to('#replyBubble', {
            duration: 0.35,
            opacity: 1,
            y: 0,
            ease: 'back.out(1.5)'
          });
        }
      });
    }

    // ============================================
    // API 调用
    // ============================================
    async function callAPI(endpoint, options = {}) {
      const url = API_BASE + endpoint;
      const resp = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    async function patNeko() {
      if (state.isRequesting) return;
      state.isRequesting = true;
      const btn = document.getElementById('patBtn');
      btn.disabled = true;

      gsap.to(btn, { duration: 0.12, scale: 0.94, yoyo: true, repeat: 1 });

      try {
        const data = await callAPI('/api/greet', {
          method: 'POST',
          body: JSON.stringify({ action: 'pat' })
        });

        if (data.success) {
          showReply(data.reply);
          updateStatusUI(data.state);

          gsap.to('.card', {
            duration: 0.15,
            rotation: 1,
            yoyo: true,
            repeat: 3,
            ease: 'sine.inOut',
            onComplete: () => gsap.set('.card', { rotation: 0 })
          });

          gsap.to('.ear', {
            duration: 0.1,
            rotation: (i) => i === 0 ? -16 : 16,
            yoyo: true,
            repeat: 5,
            onComplete: () => gsap.to('.ear', { rotation: 0, duration: 0.2 })
          });
        }
      } catch (err) {
        console.error('请求失败:', err);
        setConnectionStatus(false, '连接失败');
        showReply({ text: '呜…猫娘好像睡着了…（检查后端服务）', emoji: '😿' });
      } finally {
        state.isRequesting = false;
        btn.disabled = false;
      }
    }

    async function feedNeko() {
      if (state.isRequesting) return;
      state.isRequesting = true;
      const btn = document.getElementById('feedBtn');
      btn.disabled = true;

      gsap.to(btn, { duration: 0.12, scale: 0.94, yoyo: true, repeat: 1 });

      try {
        const data = await callAPI('/api/neko/feed', { method: 'POST' });
        if (data.success) {
          showReply({ text: data.message, emoji: '😻' });
          updateStatusUI(data.state);

          gsap.fromTo('#fullnessVal',
            { scale: 1.6, color: '#e08a7a' },
            { scale: 1, color: '#b07d5e', duration: 0.6, ease: 'back.out(2)' }
          );
        }
      } catch (err) {
        console.error('请求失败:', err);
        setConnectionStatus(false, '连接失败');
        showReply({ text: '小鱼干…好像没能送到…', emoji: '😿' });
      } finally {
        state.isRequesting = false;
        btn.disabled = false;
      }
    }

    async function fetchInitialStatus() {
      try {
        const data = await callAPI('/api/neko/status');
        if (data.success) {
          setConnectionStatus(true, '已连接');
          updateStatusUI(data.neko);
          showReply({ text: '香草猫娘已上线，喵～', emoji: '🌿' });
        }
      } catch (err) {
        console.error('无法连接后端:', err);
        setConnectionStatus(false, '后端未连接');
        showReply({ text: '猫娘正在赶来的路上…（后端未启动）', emoji: '😿' });
      }
    }

    // ============================================
    // GSAP 入场动画
    // ============================================
    gsap.from('.card', { duration: 1.2, y: 60, opacity: 0, ease: 'power3.out', delay: 0.1 });
    gsap.from('.cat-ears', { duration: 1, y: -50, opacity: 0, ease: 'back.out(1.7)', delay: 0.4 });
    gsap.from('.title span', { duration: 0.8, y: 30, opacity: 0, stagger: 0.1, ease: 'power2.out', delay: 0.6 });
    gsap.from('.subtitle', { duration: 0.9, y: 15, opacity: 0, ease: 'power2.out', delay: 0.9 });
    gsap.from('.status-item', { duration: 0.7, y: 20, opacity: 0, stagger: 0.08, ease: 'back.out(1.2)', delay: 1.0 });
    gsap.from('.reply-bubble', { duration: 0.9, y: 20, opacity: 0, ease: 'power2.out', delay: 1.2 });

    // ✅ 方案一：按钮改用 fromTo，明确结束状态为可见
    gsap.fromTo('.cta-button',
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 1, stagger: 0.1, ease: 'elastic.out(1, 0.5)', delay: 1.4 }
    );

    // 浮动爪印持续漂浮
    gsap.to('.paw-1', { duration: 5, y: -18, rotation: -10, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    gsap.to('.paw-2', { duration: 6, y: 22, rotation: 35, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.5 });
    gsap.to('.paw-3', { duration: 4.5, y: -14, rotation: 25, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 1 });

    // 光晕脉动
    gsap.to('.glow-1', { duration: 8, scale: 1.1, opacity: 0.6, repeat: -1, yoyo: true, ease: 'sine.inOut' });
    gsap.to('.glow-2', { duration: 10, scale: 1.15, opacity: 0.65, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 1 });

    // 猫耳待机晃动
    gsap.to('.ear:first-child', { duration: 3, rotation: -14, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 1.8 });
    gsap.to('.ear.right', { duration: 3.2, rotation: 14, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 2 });

    // ============================================
    // 事件绑定 & 初始化
    // ============================================
    document.getElementById('patBtn').addEventListener('click', patNeko);
    document.getElementById('feedBtn').addEventListener('click', feedNeko);

    window.addEventListener('load', () => {
      fetchInitialStatus();
    });
  </script>
</body>
</html>
