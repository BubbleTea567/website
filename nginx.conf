server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css text/plain application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}